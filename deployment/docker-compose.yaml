services:
  aurbit-endpoint:
    image: ghcr.io/bharath1910/aurbit:1.0.0
    scale: 4
    networks:
      - aurbit
    env_file:
      - ../.env

  nginx:
    image: nginx
    networks:
      - aurbit
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginxlogs:/logs
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - aurbit-endpoint

  # Metrices
  fluentd:
    build: ./fluentd
    container_name: aurbit-fluentd
    networks:
      - aurbit
    ports:
      - "24231:24231"
    depends_on:
      - nginx
    volumes:
      - nginxlogs:/var/log/nginx/:ro
      - ./fluentd/fluent.conf:/etc/fluent/fluentd.conf

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    container_name: cadvisor
    networks:
      - aurbit
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk:/dev/disk/:ro
    ports:
      - "8082:8080"

  prometheus:
    image: prom/prometheus
    networks:
      - aurbit
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
      - "prometheus-data:/prometheus"

  # Data
  migrations:
    image: node:23-alpine
    command: npx prisma migrate deploy --schema /app/prisma/schema.prisma
    env_file:
      - ../.env
    depends_on:
      - db
    volumes:
      - ../prisma:/app/prisma
    networks:
      - aurbit

  db:
    image: postgres
    container_name: aurbit-db
    env_file:
      - ../.env
    volumes:
      - db:/data/postgres
    ports:
      - "5434:5432"
    networks:
      - aurbit
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  nginxlogs:
  prometheus-data:
  db:

networks:
  aurbit:
